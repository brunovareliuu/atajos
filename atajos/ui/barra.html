<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { width: 58px; }
  #col { display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 12px 0 11px; }
  .ic { width: 58px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .aro { position: relative; width: 46px; height: 46px; transition: transform .35s var(--spring); }
  .ic.hover .aro, .ic.fijo .aro { transform: scale(1.09); }
  .aro svg.anillo { position: absolute; inset: 0; transform: rotate(-90deg); }
  .aro .pista { stroke: rgba(255, 255, 255, .12); }
  .aro .valor { stroke: var(--accent); transition: stroke-dashoffset .9s cubic-bezier(.3, 1, .3, 1), stroke .3s; }
  .aro .valor.lineal { transition: stroke-dashoffset 1s linear; }
  .centro {
    position: absolute; inset: 6px; border-radius: 50%; background: rgba(255, 255, 255, .1);
    display: grid; place-items: center; overflow: hidden; color: rgba(255, 255, 255, .92);
    transition: background .2s;
  }
  #c-spotify:has(svg) { background: none; }
  .ic.hover .centro { background: rgba(255, 255, 255, .18); }
  .ic.fijo .centro { box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .5) inset; }
  .centro img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; animation: gira 14s linear infinite; animation-play-state: paused; }
  .centro img.suena { animation-play-state: running; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .centro img + .hoyo { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: rgba(20, 20, 22, .85); box-shadow: 0 0 0 1.5px rgba(255,255,255,.25); }
  .et { font-size: 8px; font-weight: 600; color: rgba(235, 235, 245, .68); letter-spacing: .02em; line-height: 1; white-space: nowrap; }
  .badge {
    position: absolute; top: -2px; right: -3px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px;
    background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center;
    box-shadow: 0 0 0 2px rgba(20, 20, 22, .9); transform: scale(0); transition: transform .35s var(--spring);
  }
  .badge.on { transform: scale(1); }
  body.soltando #i-airdrop .aro { transform: scale(1.15); }
  body.soltando #i-airdrop .centro { background: var(--azul); color: #fff; }
  /* Neutral icons with no labels; only the Claude and Spotify rings get color.
     No labels: Claude's % only shows in its ring. */
  .et { display: none; }
  .badge { display: none !important; }
  #i-dictado .valor.dict { stroke: #ff3b30; }
  #i-dictado .stop { display: none; width: 12px; height: 12px; border-radius: 3px; background: var(--accent); }
  #i-dictado.rec .mic { display: none; }
  #i-dictado.rec .stop { display: block; }
  #i-dictado.rec .valor.dict { animation: late-aro 1.3s ease-in-out infinite; }
  #i-dictado.rec .et { color: #fff; }
  @keyframes late-aro { 0%, 100% { stroke-dashoffset: 92; opacity: .7 } 50% { stroke-dashoffset: 18; opacity: 1 } }
  .sep { width: 22px; height: 1px; background: rgba(255, 255, 255, .1); margin: 1px 0; }
</style>
</head>
<body>
<div id="col">
  <div class="ic" id="i-dictado" data-t="dictado">
    <div class="aro">
      <svg class="anillo" viewBox="0 0 46 46"><circle class="pista" cx="23" cy="23" r="21" fill="none" stroke-width="3"/><circle class="valor dict" cx="23" cy="23" r="21" fill="none" stroke-width="3" stroke-linecap="round"/></svg>
      <div class="centro"><svg class="mic" width="15" height="18" viewBox="0 0 14 17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="4" y="1" width="6" height="9.5" rx="3"/><path d="M1.5 8.5a5.5 5.5 0 0 0 11 0M7 14v2"/></svg><span class="stop"></span></div>
    </div>
    <span class="et num" id="et-dictado">Dictate</span>
  </div>
  <div class="ic" id="i-claude" data-t="claude">
    <div class="aro">
      <svg class="anillo" viewBox="0 0 46 46"><circle class="pista" cx="23" cy="23" r="21" fill="none" stroke-width="3"/><circle class="valor" cx="23" cy="23" r="21" fill="none" stroke-width="3" stroke-linecap="round"/></svg>
      <div class="centro">
        <svg width="21" height="21" viewBox="0 0 100 100" fill="#D97757" aria-label="Claude"><path d="m19.6 66.5 19.7-11 .3-1-.3-.5h-1l-3.3-.2-11.2-.3L14 53l-9.5-.5-2.4-.5L0 49l.2-1.5 2-1.3 2.9.2 6.3.5 9.5.6 6.9.4L38 49.1h1.6l.2-.7-.5-.4-.4-.4L29 41l-10.6-7-5.6-4.1-3-2-1.5-2-.6-4.2 2.7-3 3.7.3.9.2 3.7 2.9 8 6.1L37 36l1.5 1.2.6-.4.1-.3-.7-1.1L33 25l-6-10.4-2.7-4.3-.7-2.6c-.3-1-.4-2-.4-3l3-4.2L28 0l4.2.6L33.8 2l2.6 6 4.1 9.3L47 29.9l2 3.8 1 3.4.3 1h.7v-.5l.5-7.2 1-8.7 1-11.2.3-3.2 1.6-3.8 3-2L61 2.6l2 2.9-.3 1.8-1.1 7.7L59 27.1l-1.5 8.2h.9l1-1.1 4.1-5.4 6.9-8.6 3-3.5L77 13l2.3-1.8h4.3l3.1 4.7-1.4 4.9-4.4 5.6-3.7 4.7-5.3 7.1-3.2 5.7.3.4h.7l12-2.6 6.4-1.1 7.6-1.3 3.5 1.6.4 1.6-1.4 3.4-8.2 2-9.6 2-14.3 3.3-.2.1.2.3 6.4.6 2.8.2h6.8l12.6 1 3.3 2 1.9 2.7-.3 2-5.1 2.6-6.8-1.6-16-3.8-5.4-1.3h-.8v.4l4.6 4.5 8.3 7.5L89 80.1l.5 2.4-1.3 2-1.4-.2-9.2-7-3.6-3-8-6.8h-.5v.7l1.8 2.7 9.8 14.7.5 4.5-.7 1.4-2.6 1-2.7-.6-5.8-8-6-9-4.7-8.2-.5.4-2.9 30.2-1.3 1.5-3 1.2-2.5-2-1.4-3 1.4-6.2 1.6-8 1.3-6.4 1.2-7.9.7-2.6v-.2H49L43 72l-9 12.3-7.2 7.6-1.7.7-3-1.5.3-2.8L24 86l10-12.8 6-7.9 4-4.6-.1-.5h-.3L17.2 77.4l-4.7.6-2-2 .2-3 1-1 8-5.5Z"/></svg>
      </div>
    </div>
    <span class="et num" id="et-claude">—</span>
  </div>

  <div class="ic" id="i-spotify" data-t="spotify">
    <div class="aro">
      <svg class="anillo" viewBox="0 0 46 46"><circle class="pista" cx="23" cy="23" r="21" fill="none" stroke-width="3"/><circle class="valor lineal" cx="23" cy="23" r="21" fill="none" stroke-width="3" stroke-linecap="round" style="stroke:var(--verde)"/></svg>
      <div class="centro" id="c-spotify">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="#1ED760" aria-label="Spotify"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
      </div>
    </div>
    <span class="et num" id="et-spotify">Spotify</span>
  </div>

  

  <div class="ic" id="i-copiados" data-t="copiados">
    <div class="aro">
      <svg class="anillo" viewBox="0 0 46 46"><circle class="pista" cx="23" cy="23" r="21" fill="none" stroke-width="3"/></svg>
      <div class="centro"><svg width="17" height="19" viewBox="0 0 14 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2" y="2.5" width="10" height="12" rx="2"/><path d="M5 2.5V2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v.5"/><path d="M5 7h4M5 10h3" stroke-linecap="round"/></svg></div>
      <span class="badge num" id="b-copiados"></span>
    </div>
    <span class="et">Copied</span>
  </div>

  <div class="ic" id="i-archivos" data-t="archivos">
    <div class="aro">
      <svg class="anillo" viewBox="0 0 46 46"><circle class="pista" cx="23" cy="23" r="21" fill="none" stroke-width="3"/></svg>
      <div class="centro"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M1.75 4.5c0-.83.67-1.5 1.5-1.5h3l1.5 1.5h5c.83 0 1.5.67 1.5 1.5v5.75c0 .83-.67 1.5-1.5 1.5h-9.5c-.83 0-1.5-.67-1.5-1.5z"/></svg></div>
    </div>
    <span class="et">Files</span>
  </div>

  <div class="ic" id="i-airdrop" data-t="airdrop">
    <div class="aro">
      <svg class="anillo" viewBox="0 0 46 46"><circle class="pista" cx="23" cy="23" r="21" fill="none" stroke-width="3"/></svg>
      <div class="centro"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5.2 14.6a6.8 6.8 0 1 1 9.6 0"/><path d="M7.6 12.2a3.4 3.4 0 1 1 4.8 0"/><circle cx="10" cy="10" r=".9" fill="currentColor"/></svg></div>
    </div>
    <span class="et">AirDrop</span>
  </div>

  <div class="ic" id="i-sesiones" data-t="sesiones">
    <div class="aro">
      <svg class="anillo" viewBox="0 0 46 46"><circle class="pista" cx="23" cy="23" r="21" fill="none" stroke-width="3"/></svg>
      <div class="centro"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M4.5 6.5 6.5 8l-2 1.5M8.5 10h3"/></svg></div>
    </div>
    <span class="et">Sessions</span>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const C = 2 * Math.PI * 21;
document.querySelectorAll('.valor').forEach(c => { c.style.strokeDasharray = C; c.style.strokeDashoffset = C; });
const anillo = (tipo, frac, color) => {
  const c = document.querySelector(`#i-${tipo} .valor`); if (!c) return;
  c.style.strokeDashoffset = C * (1 - Math.max(0, Math.min(1, frac || 0)));
  if (color) c.style.stroke = color;
};

function reportar() {
  api.iconos([...document.querySelectorAll('.ic')].map(el => ({ tipo: el.dataset.t, top: el.offsetTop, alto: el.offsetHeight })));
  api.alto_barra($('#col').offsetHeight);
}
window.addEventListener('load', reportar);
new ResizeObserver(reportar).observe($('#col'));

let tDict = null;
window.dictado = (d) => {
  const el = $('#i-dictado'); el.classList.toggle('rec', !!d.grabando);
  clearInterval(tDict);
  if (d.grabando) {
    const t0 = d.inicio * 1000;
    const tic = () => { const s = Math.max(0, (Date.now() - t0) / 1000); $('#et-dictado').textContent = `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`; };
    tic(); tDict = setInterval(tic, 500);
  } else { $('#et-dictado').textContent = 'Dictate'; }
};
window.hover = (t) => document.querySelectorAll('.ic').forEach(el => el.classList.toggle('hover', el.dataset.t === t));
window.fijo = (t) => document.querySelectorAll('.ic').forEach(el => el.classList.toggle('fijo', el.dataset.t === t));
window.soltando = (si) => document.body.classList.toggle('soltando', si);
document.querySelectorAll('.ic').forEach(el => el.addEventListener('click', () => api.clic_icono(el.dataset.t)));

const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
let portadaActual = '';
window.estado = (e) => {
  // Claude: session % (5 h) if Claude Code reports it; otherwise the weekly one.
  const u = e.uso || {};
  const v = u.five_hour || u.seven_day;
  if (u.hay && v) {
    const p = v.pct || 0;
    anillo('claude', p / 100, p >= 80 ? 'var(--rojo)' : 'var(--accent)');
    $('#et-claude').textContent = `${Math.round(p)}%`;
  } else { anillo('claude', 0); $('#et-claude').textContent = '—'; }

  // Spotify: spinning cover art and a ring with the track's progress.
  const s = e.spotify || {};
  const c = $('#c-spotify');
  if (s.abierto && s.titulo) {
    anillo('spotify', s.duracion ? s.posicion / s.duracion : 0);
  } else {
    anillo('spotify', 0);
  }
  if (portadaActual !== '·') {  // always the logo, never the cover art
    portadaActual = '·';
    c.innerHTML = '<svg width="32" height="32" viewBox="0 0 24 24" fill="#1ED760" aria-label="Spotify"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>';
  }

  const n = e.copiados_hoy || 0, b = $('#b-copiados');
  b.textContent = n > 99 ? '99+' : n; b.classList.toggle('on', n > 0);
};
api.estado().then(window.estado);
</script>
</body>
</html>
